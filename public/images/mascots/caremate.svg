<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">CareMate mascot</title>
  <desc id="desc">A friendly white care robot with blue ear pieces holding a pink heart.</desc>
  <defs>
